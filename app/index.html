<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="K3 builder: configure your document control logs and download them as Excel workbooks."><link rel="icon" href="../favicon.svg" type="image/svg+xml"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>K3</title>
<style>
/* Layout: desktop-tool shell (top bar, step list, form pane, live workbook preview). Office-like neutrals, one green accent. */
:root {
  --bg: #f3f3f3; --panel: #ffffff; --head: #fafafa; --line: #e0e0e0; --line-2: #c8c8c8;
  --fg: #1f1f1f; --muted: #616161; --faint: #8a8a8a;
  --accent: #1e7145; --accent-hover: #185c38; --accent-soft: #e7f3ec; --on-accent: #ffffff;
  --bad: #c42b1c; --bad-soft: #fde7e9; --warn: #8a5300; --warn-soft: #fff4ce; --ok: #107c10;
  --grid: #e6e6e6; --gridhead: #f0f0f0;
  --seg-1: #1d4ed8; --seg-2: #0f766e; --seg-3: #7c3aed; --seg-4: #b45309; --seg-5: #be185d; --seg-6: #0369a1; --seg-7: #1f1f1f; --seg-8: #4d7c0f; --seg-9: #9333ea;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1c1c; --panel: #262626; --head: #2c2c2c; --line: #383838; --line-2: #4e4e4e; --fg: #f0f0f0; --muted: #b0b0b0; --faint: #8c8c8c;
  --accent: #4cb782; --accent-hover: #63c794; --accent-soft: #1d3a2b; --on-accent: #0b1f14;
  --bad: #ff99a4; --bad-soft: #442726; --warn: #fce100; --warn-soft: #433519; --ok: #6ccb5f; --grid: #3a3a3a; --gridhead: #303030;
  --seg-1: #93b4ff; --seg-2: #2dd4bf; --seg-3: #c4a5ff; --seg-4: #fbbf24; --seg-5: #f9a8d4; --seg-6: #7dd3fc; --seg-7: #f0f0f0; --seg-8: #a3e635; --seg-9: #d8b4fe;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1c1c1c; --panel: #262626; --head: #2c2c2c; --line: #383838; --line-2: #4e4e4e; --fg: #f0f0f0; --muted: #b0b0b0; --faint: #8c8c8c;
  --accent: #4cb782; --accent-hover: #63c794; --accent-soft: #1d3a2b; --on-accent: #0b1f14;
  --bad: #ff99a4; --bad-soft: #442726; --warn: #fce100; --warn-soft: #433519; --ok: #6ccb5f; --grid: #3a3a3a; --gridhead: #303030;
  --seg-1: #93b4ff; --seg-2: #2dd4bf; --seg-3: #c4a5ff; --seg-4: #fbbf24; --seg-5: #f9a8d4; --seg-6: #7dd3fc; --seg-7: #f0f0f0; --seg-8: #a3e635; --seg-9: #d8b4fe;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
h2, h3, h4 { margin: 0; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--fg); }

/* shell */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  min-height: 48px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-size: 15px; font-weight: 600; white-space: nowrap; }
.brand svg { flex: none; }
.crumb { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb::before { content: "/"; margin-right: 10px; color: var(--line-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.app { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr) 380px; gap: 16px; padding-inline: 16px; padding-block: 16px 40px; align-items: start; }
@media (max-width: 1180px) { .app { grid-template-columns: 190px minmax(0, 1fr); } .preview { grid-column: 1 / -1; position: static !important; } }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { position: static !important; flex-direction: row !important; overflow-x: auto; } .rail .grp { display: none; } .rail button { white-space: nowrap; } }

/* steps */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: flex; flex-direction: column; gap: 1px; }
.rail .grp { font-size: 12px; font-weight: 600; color: var(--faint); padding: 14px 10px 4px; }
.rail .grp:first-child { padding-top: 2px; }
.rail button { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-left: 3px solid transparent; border-radius: 0 4px 4px 0; background: none; cursor: pointer; text-align: left; color: var(--fg); }
.rail button:hover { background: var(--panel); }
.rail button[aria-current="step"] { background: var(--panel); border-left-color: var(--accent); font-weight: 600; }
.rail .n { width: 16px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.rail svg { width: 16px; flex: none; color: var(--accent); }

/* form pane */
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px clamp(16px, 2.5vw, 28px) 24px; min-width: 0; }
.sheet h2 { font-size: 20px; }
.sheet .lead { color: var(--muted); margin: 4px 0 18px; max-width: 72ch; }
.sheet h3 { font-size: 14px; margin: 24px 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sheet h3 .hint { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 16px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; min-width: 0; }
input[type=text], input[type=date], input[type=number], select, textarea { height: 32px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; padding: 4px 8px; width: 100%; min-width: 0; font-weight: 400; font-size: 14px; }
input[type=color] { height: 32px; width: 64px; padding: 2px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
input.code { font-family: var(--mono); text-transform: uppercase; }
input.mono { font-family: var(--mono); }
input.bad { border-color: var(--bad); background: var(--bad-soft); }
input[type=file] { font-size: 13px; max-width: 100%; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; }
.tbl th { font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px 8px; background: var(--head); border-bottom: 1px solid var(--line); }
.tbl td { padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td input, .tbl td select { border-color: transparent; background: transparent; }
.tbl td input:hover, .tbl td select:hover { border-color: var(--line-2); }
.tbl td.x { width: 36px; text-align: center; }
.iconbtn { border: 0; background: none; cursor: pointer; color: var(--muted); width: 28px; height: 28px; border-radius: 4px; font-size: 15px; line-height: 1; }
.iconbtn:hover { background: var(--bg); color: var(--fg); }
.iconbtn.del:hover { background: var(--bad-soft); color: var(--bad); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.addrow { margin-top: 8px; }
.btn { height: 32px; border: 1px solid var(--line-2); background: var(--panel); padding: 0 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: progress; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* template list */
.tpl { border: 1px solid var(--line); border-radius: 4px; }
.tpl label { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--line); align-items: start; }
.tpl label:last-child { border-bottom: 0; }
.tpl label:hover { background: var(--head); }
.tpl label.sel { background: var(--accent-soft); }
.tpl input { margin: 3px 0 0; accent-color: var(--accent); }
.tpl b { font-weight: 600; }
.tpl .d { grid-column: 2; color: var(--muted); font-size: 13px; }
.tpl .r { grid-column: 3; grid-row: 1 / span 2; text-align: right; font-size: 12.5px; color: var(--muted); }
.tpl .r .mono { display: block; color: var(--fg); font-size: 12px; }
@media (max-width: 640px) { .tpl label { grid-template-columns: 18px minmax(0, 1fr); } .tpl .r { grid-column: 2; grid-row: auto; text-align: left; } }

.tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tok { font: 600 12px var(--mono); border: 1px solid var(--line-2); background: var(--panel); padding: 3px 7px; border-radius: 4px; cursor: pointer; }
.tok:hover { background: var(--bg); }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.day { height: 32px; width: 52px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; cursor: pointer; }
.day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { height: 30px; border: 0; padding: 0 12px; font-size: 13px; background: var(--panel); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 28px; border: 1px solid var(--line-2); background: var(--panel); border-radius: 4px; padding: 0 9px; cursor: pointer; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.chip .mono { font-size: 11.5px; }

/* logs step */
.logs { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .logs { grid-template-columns: minmax(0, 1fr); } }
.loglist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.logitem { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: center; padding: 8px 10px; cursor: pointer; text-align: left; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
.logitem:hover { background: var(--head); }
.logitem[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.logitem.off b { color: var(--faint); }
.logitem b { font-size: 13.5px; font-weight: 600; }
.logitem small { grid-column: 2; color: var(--muted); font-size: 12px; }
.logitem input { accent-color: var(--accent); }
.loglist .btn { border: 0; border-radius: 0; justify-content: flex-start; color: var(--accent); }
.logeditor { min-width: 0; display: flex; flex-direction: column; }
.box { border-top: 1px solid var(--line); padding: 14px 0 6px; }
.box:first-child { border-top: 0; padding-top: 0; }
.box > h4 { font-size: 14px; margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.colstrip { display: flex; overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; margin-top: 8px; }
.colstrip div { flex: none; padding: 5px 8px; font-size: 11.5px; font-weight: 600; color: #fff; border-right: 1px solid rgba(255,255,255,.3); white-space: nowrap; }
.fieldgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.field { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
.field input[type=text] { height: 28px; border-color: transparent; background: transparent; }
.field input[type=text]:hover { border-color: var(--line-2); }
.field input[type=checkbox] { accent-color: var(--accent); }
.field.off { background: var(--head); }
.field.off input[type=text] { color: var(--faint); }
.field .badge { grid-column: 2; font-size: 11.5px; color: var(--faint); padding-left: 9px; }
.pathbox { font: 12.5px var(--mono); background: var(--head); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; overflow-wrap: anywhere; }

/* branding */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { border: 1px solid var(--line-2); border-radius: 4px; padding: 3px; cursor: pointer; background: var(--panel); display: flex; }
.swatch i { width: 22px; height: 22px; display: block; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.logos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.logo { border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.logo b { font-weight: 600; font-size: 13px; }
.logo .img { height: 56px; width: 100%; display: grid; place-items: center; background: #fff; border-radius: 3px; border: 1px solid var(--line); }
.logo img { max-height: 48px; max-width: 90%; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.mock { border: 1px solid var(--line); border-radius: 4px; background: #fff; color: #111827; overflow: hidden; font-family: "Segoe UI", Calibri, Arial, sans-serif; }
.mock .band { height: 5px; }
.mock .tb { display: grid; grid-template-columns: 110px 1fr 110px; align-items: center; padding: 8px 10px; gap: 8px; }
.mock .tb .lg { height: 40px; display: grid; place-items: center; }
.mock .tb img { max-height: 38px; max-width: 105px; }
.mock .tb .ph { font-size: 10px; color: #94a3b8; border: 1px dashed #cbd5e1; padding: 4px 6px; border-radius: 3px; }
.mock .center { text-align: center; }
.mock .center b { display: block; font-size: 14px; }
.mock .center span { display: block; font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.mock .center small { display: block; font-size: 9.5px; color: #64748b; }
.mock .kpi { font-size: 10px; font-weight: 700; text-align: center; padding: 4px; }
.mock table { border-collapse: collapse; width: 100%; font-size: 10px; }
.mock th { color: #fff; padding: 4px 5px; text-align: center; font-weight: 700; white-space: nowrap; }
.mock td { padding: 3px 5px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
.mock .st { padding: 1px 6px; border-radius: 3px; }
.mockwrap { overflow-x: auto; }
.gen { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--head); }
.status { font-size: 13.5px; min-height: 1.4em; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); }

/* preview: a small Excel window */
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ptitle { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: -4px; }
.xl { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; font-size: 12px; }
.xl-bar { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: var(--head); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; min-width: 0; }
.xl-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xl-bar svg { flex: none; }
.xl-fx { display: grid; grid-template-columns: 48px 26px minmax(0, 1fr); border-bottom: 1px solid var(--line); height: 28px; align-items: center; }
.xl-fx > * { padding: 0 8px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; min-width: 0; }
.xl-fx i { font-style: italic; font-family: Georgia, serif; color: var(--muted); justify-content: center; padding: 0; }
.xl-fx .v { border-right: 0; font-family: var(--mono); font-size: 11.5px; overflow: hidden; white-space: nowrap; }
.xl-grid { overflow-x: auto; }
.xl-grid table { border-collapse: collapse; font-size: 11px; color: #1f1f1f; background: #fff; min-width: 100%; }
.xl-grid td, .xl-grid th { border: 1px solid #e3e3e3; padding: 2px 6px; white-space: nowrap; height: 20px; }
.xl-grid .ch { background: #f3f3f3; color: #616161; font-weight: 400; text-align: center; font-size: 10.5px; }
.xl-grid .rh { background: #f3f3f3; color: #616161; text-align: center; width: 26px; font-size: 10.5px; }
.xl-grid .hd { color: #fff; font-weight: 600; text-align: center; }
.xl-grid .sel { outline: 2px solid #1e7145; outline-offset: -2px; }
.xl-tabs { display: flex; gap: 2px; padding: 0 8px; background: var(--head); border-top: 1px solid var(--line); height: 28px; align-items: stretch; font-size: 12px; }
.xl-tabs span { padding: 5px 12px; color: var(--muted); }
.xl-tabs span.on { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.plist { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 13px; }
.plist > div { padding: 7px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.plist > div:last-child { border-bottom: 0; }
.plist .h { font-weight: 600; justify-content: space-between; background: var(--head); }
.plist .h span { font-weight: 400; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.dot.bad { background: var(--bad); } .dot.warn { background: #d29200; } .dot.ok { background: var(--ok); }
.plist .f { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.plist .f.dir { color: var(--muted); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: auto; z-index: 5; background: var(--fg); color: var(--panel); padding: 10px 14px; border-radius: 4px; font-size: 13.5px; }
</style>

  </div>
  <div class="actions">
    <a class="btn" href="https://github.com/kareemelthird/k3/issues/new/choose" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Feedback</a>
    <button class="btn" type="button" id="tbLoad">Open setup…</button>
    <button class="btn" type="button" id="tbSave">Save setup</button>

</header>

</div>

/*

 *  - Workbook: writes a .xlsx from scratch (styles, shared strings, tables with

 *  - Images: logos on a sheet (drawing) and in the print header/footer (VML),

    s.append(gen);
    s.append(h("h3", { text: "After you unzip" }));
    s.append(h("p", { class: "note", style: "margin:0 0 8px;max-width:72ch", text: "Important: before extracting, right-click the ZIP > Properties > tick Unblock > OK, then Extract All. Opening files from inside the ZIP, or without unblocking, makes Excel block the Hub's data connections." }));
    s.append(h("ol", { style: "margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:72ch" }, [
      h("li", { text: "Open any log in the Logs folder, click Enable Editing, and enter data. Each log has its own Lists sheet for dropdowns." }),
      h("li", { text: "Save PDFs into the Documents folders. The Link column opens the matching file or folder." }),
      h("li", { text: "Open the Hub, click Enable Editing and Enable Content if Excel shows a yellow bar, then Data ▸ Refresh All. If Power Query asks about privacy levels, tick \"Ignore Privacy Levels checks for this file\" and Save." }),
    ]));
    s.append(h("h3", null, ["Keep this setup", h("span", { class: "hint", text: "reuse it for the next project or share it with your team" })]));
    s.append(h("button", { class: "btn", type: "button", text: "Save setup as .json", onclick: function () { save(base() + " setup.json", new Blob([JSON.stringify(c, null, 2)], { type: "application/json" })); } }));
  };
  function base() { return ((state.cfg.project.code ? state.cfg.project.code + " " : "") + "Document Control").replace(/[\\/:*?"<>|]/g, ""); }

  // ---------------- validation
  function issues() {
    var c = state.cfg, out = [];
    var dupes = function (arr, what) {
      var seen = {}; arr.forEach(function (r) { var k = String(r.code || "").toUpperCase(); if (!k) return; if (seen[k]) out.push(["bad", "Duplicate " + what + " code " + k]); seen[k] = 1; });
    };
    if (!c.project.code) out.push(["bad", "Project code is empty"]);
    if (!c.parties.length) out.push(["bad", "Add at least one party"]);
    if (!c.disciplines.length) out.push(["bad", "Add at least one discipline"]);
    if (!c.statuses.length) out.push(["bad", "Add review status codes"]);
    dupes(c.parties, "party"); dupes(c.disciplines, "discipline"); dupes(c.areas, "area"); dupes(c.levels, "level"); dupes(c.docTypes, "document type"); dupes(c.statuses, "status");
    var on = c.logs.filter(function (l) { return l.enabled !== false; });
    if (!on.length) out.push(["bad", "Switch on at least one log"]);
    var names = {};
    on.forEach(function (l) {
      var nm = l.name || "(untitled)";
      if (names[nm.toLowerCase()]) out.push(["bad", "Two logs are called " + nm]); names[nm.toLowerCase()] = 1;
      if (!l.types.length) out.push(["bad", nm + ": pick at least one document type"]);
      if (l.refMode !== "manual" && (l.pattern || c.numbering.pattern).indexOf("{SEQ}") < 0) out.push(["bad", nm + ": pattern has no {SEQ}"]);
      if (l.link && l.link.mode === "file" && l.link.pattern && l.link.pattern.indexOf("{REF}") < 0) out.push(["warn", nm + ": file name doesn't use {REF}"]);
      var seen = {}, sys = {};
      L.fieldsFor(l, c).forEach(function (f) { if (!f.custom) sys[f.label.toLowerCase()] = 1; });
      L.fieldsFor(l, c).forEach(function (f) {
        var k = f.label.toLowerCase();
        if (seen[k]) out.push(["bad", nm + ": two columns are called " + f.label]); seen[k] = 1;
      });
      if (L.hasItems(l)) {
        var iseen = {};
        L.itemFieldsFor(l, c).forEach(function (f) { var k = f.label.toLowerCase(); if (iseen[k]) out.push(["bad", nm + ": two item columns are called " + f.label]); iseen[k] = 1; });
        if (!l.items.name || /[\[\]:*?\/\\]/.test(l.items.name)) out.push(["warn", nm + ": item sheet name is empty or has characters Excel doesn't allow"]);
      }
      l.custom.forEach(function (cc) { if (!cc.name || !cc.name.trim()) out.push(["bad", nm + ": a custom column has no header"]); if (cc.type === "list" && !(cc.options || []).length) out.push(["warn", nm + ": " + cc.name + " has no dropdown values"]); });
      var pat = l.pattern || c.numbering.pattern;
      if (/\{AREA\}/.test(pat) && !c.areas.length) out.push(["warn", nm + ": pattern uses {AREA} but no areas are listed"]);
      if (/\{LVL\}/.test(pat) && !c.levels.length) out.push(["warn", nm + ": pattern uses {LVL} but no levels are listed"]);
      if (/\{TO\}/.test(pat) && l.kind === "register") out.push(["warn", nm + ": registers have no receiver for {TO}"]);
    });
    if (!c.parties.some(function (p) { return p.code === c.company.ourCode; })) out.push(["warn", "Your party code isn't in the Parties list"]);
    return out;
  }
  function cleanCfg() {
    var c = JSON.parse(JSON.stringify(state.cfg));
    ["parties", "disciplines", "areas", "levels", "docTypes", "statuses", "purposes"].forEach(function (k) {
      c[k] = (c[k] || []).filter(function (r) { return r.code; }).map(function (r) { r.code = String(r.code).trim().toUpperCase(); return r; });
    });
    c.numbering.digits = +c.numbering.digits || 4;
    c.docTypes.forEach(function (t) { t.reviewDays = t.reviewDays === "" || t.reviewDays == null ? null : +t.reviewDays; });
    c.logs.forEach(function (l) { if (l.items) l.items.custom = (l.items.custom || []).filter(function (x) { return x.name && x.name.trim(); }); });
    c.logs.forEach(function (l) { l.custom = l.custom.filter(function (x) { return x.name && x.name.trim(); }).map(function (x) { x.name = x.name.trim(); return x; }); l.days = +l.days || 0; });
    if (!c.parties.some(function (p) { return p.code === c.company.ourCode; }) && c.parties[0]) c.company.ourCode = c.parties[0].code;
    return c;
  }

  // ---------------- preview panel: a small Excel window showing the selected log
  var STATUS_CLR = { Approved: ["#DCFCE7", "#166534"], "Approved with Comments": ["#ECFCCB", "#3F6212"], "Under Review": ["#FEF3C7", "#92400E"], Overdue: ["#FEE2E2", "#991B1B"],
    "Revise & Resubmit": ["#FFEDD5", "#9A3412"], Open: ["#FEF3C7", "#92400E"], Closed: ["#DCFCE7", "#166534"], "No Reply Needed": ["#F1F5F9", "#64748B"] };
  function renderPreview() {
    var c = state.cfg, pv = $("#preview"); pv.textContent = "";
    $("#crumb").textContent = (c.project.code || "PRJ") + " · " + (c.project.name || "Untitled project");
    var on = c.logs.filter(function (l) { return l.enabled !== false; });
    var log = STEPS[state.step].id === "logs" ? curLog() : on[0];
    if (log) {
      var br = c.branding, fields = L.fieldsFor(log, c).filter(function (f) { return !f.def.hidden; });
      var show = fields.slice(0, 7);
      var ref1 = log.refMode === "manual" ? "ACN/1452/" + new Date().getFullYear() : sampleRef(c, log);
      var statuses = log.kind === "submittal" ? ["Approved", "Under Review", "Revise & Resubmit"] : log.kind === "correspondence" ? ["Closed", "Open", "No Reply Needed"] : ["Closed", "Open", "Overdue"];
      var refCol = fields.findIndex(function (f) { return f.key === "Ref No"; });
      var win = h("div", { class: "xl" });
      win.append(h("div", { class: "xl-bar" }, [h("svg", null), h("span", { text: PK.fileName(c, log) + ".xlsx" })]));
      win.querySelector("svg").outerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x=".7" y=".7" width="12.6" height="12.6" rx="1.5" fill="none" stroke="#1e7145" stroke-width="1.2"/><path d="M.7 5h12.6M5 5v8.3" stroke="#1e7145" stroke-width="1.2"/></svg>';
      var formula = log.refMode === "manual" ? ref1 : "=" + ref1.replace(/-?0*1$/, "") + "…  (built from segments)";
      win.append(h("div", { class: "xl-fx" }, [h("span", { class: "mono", text: XK.colName(refCol + 1) + "9" }), h("i", { text: "fx" }), h("span", { class: "v", text: log.refMode === "manual" ? ref1 : ref1, title: formula })]));
      var t = h("table"), hr = h("tr", null, [h("th", { class: "ch" })]);
      show.forEach(function (f, j) { hr.append(h("th", { class: "ch", text: XK.colName(j + 1) })); });
      t.append(hr);
      var row8 = h("tr", null, [h("td", { class: "rh", text: "8" })]);
      show.forEach(function (f) {
        var calc = f.def.t === "f" || (f.def.t === "ref" && log.refMode !== "manual");
        row8.append(h("td", { class: "hd", style: "background:" + (f.custom ? br.accent : calc ? L.mix(br.primary, "#94A3B8", 0.55) : br.primary), text: f.label }));
      });
      t.append(row8);
      for (var i = 0; i < 3; i++) {
        var r = h("tr", { style: br.banding !== false && i % 2 ? "background:" + L.mix(br.primary, "#FFFFFF", 0.95) : null }, [h("td", { class: "rh", text: String(9 + i) })]);
        show.forEach(function (f) {
          var st = statuses[i];
          var v = { "S/N": String(i + 1), "Ref No": i === 0 ? ref1 : ref1.replace(/1$/, String(i + 1)), Rev: c.revisions[0] || "00", Discipline: (c.disciplines[i % c.disciplines.length] || {}).code,
            Area: (c.areas[i % Math.max(1, c.areas.length)] || {}).code, Level: (c.levels[i % Math.max(1, c.levels.length)] || {}).code, Serial: String(i + 1),
            "Submitted By": c.company.ourCode, "Raised By": c.company.ourCode, From: c.company.ourCode, Originator: c.company.ourCode, "Doc Type": log.types[0],
            Title: ["Ground Floor Plan", "Slab Reinforcement L02", "Fire Fighting Layout"][i], Subject: ["Rebar inspection", "Formwork check", "Concrete pouring"][i],
            Date: ["12-Aug-26", "03-Sep-26", "21-Sep-26"][i], Status: st }[f.key];
          var td = h("td", { class: f.key === "Ref No" && i === 0 ? "sel" : null, text: v || "" });
          if (f.key === "Ref No") td.style.fontWeight = "600";
          if (f.key === "Status" && STATUS_CLR[st]) { td.style.background = STATUS_CLR[st][0]; td.style.color = STATUS_CLR[st][1]; td.style.textAlign = "center"; }
          r.append(td);
        });
        t.append(r);
      }
      win.append(h("div", { class: "xl-grid" }, [t]));
      var segs = L.splitSegments(log, c), tabs = h("div", { class: "xl-tabs", style: "overflow-x:auto" });
      if (segs.length > 1) tabs.append(h("span", { text: "Overview" }));
      segs.slice(0, 6).forEach(function (sg, i) { tabs.append(h("span", { class: i === 0 ? "on" : null, text: sg.sheet })); });
      if (segs.length > 6) tabs.append(h("span", { text: "+" + (segs.length - 6) }));
      if (L.hasItems(log)) tabs.append(h("span", { text: L.sheetName(log.items.name) }));
      tabs.append(h("span", { text: "Lists" }));
      win.append(tabs);
      pv.append(h("div", { class: "ptitle", text: "Preview · " + (log.name || "") + " · " + fields.length + " columns" }));
      pv.append(win);
    }
    var list = issues(), errs = list.filter(function (x) { return x[0] === "bad"; }).length;
    var chk = h("div", { class: "plist" }, [h("div", { class: "h" }, ["Checks", h("span", { text: list.length ? errs + " to fix, " + (list.length - errs) + " to review" : "" })])]);
    if (!list.length) chk.append(h("div", null, [h("span", { class: "dot ok" }), "No problems found."]));
    list.slice(0, 6).forEach(function (x) { chk.append(h("div", null, [h("span", { class: "dot " + x[0] }), x[1]])); });
    if (list.length > 6) chk.append(h("div", { class: "note", text: "and " + (list.length - 6) + " more" }));
    pv.append(chk);
    var files = h("div", { class: "plist" }, [h("div", { class: "h" }, ["Download contents", h("span", { text: (on.length + 1) + " workbooks" })])]);
    files.append(h("div", { class: "f", text: base() + " - Hub.xlsx" }));
    on.forEach(function (l) { files.append(h("div", { class: "f", text: "Logs\\" + PK.fileName(c, l) + ".xlsx" })); });
    files.append(h("div", { class: "f dir", text: "Documents\\  " + on.filter(function (l) { return l.link && l.link.mode !== "none"; }).length + " folders for PDFs" }));
    pv.append(files);
  }

  // ---------------- shell
  var GROUPS = [["Project", [0, 1, 2, 3]], ["Standards", [4, 5, 6, 7]], ["Output", [8, 9, 10]]];
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderRail() {
    var r = $("#rail"); r.textContent = "";
    GROUPS.forEach(function (g) {
      r.append(h("div", { class: "grp", text: g[0] }));
      g[1].forEach(function (i) {
        var st = STEPS[i];
        var b = h("button", { type: "button", "aria-current": i === state.step ? "step" : null, onclick: function () { go(i); } }, [h("span", { class: "n", text: String(i + 1) }), st.name]);
        if (state.visited[i] && i !== state.step) b.firstChild.outerHTML = CHECK;
        r.append(b);
      });
    });
  }
  function renderStep() {
    var s = $("#sheet"); s.textContent = "";
    R[STEPS[state.step].id](s, state.cfg);
    var nav = h("div", { class: "nav" });
    nav.append(state.step > 0 ? h("button", { class: "btn", type: "button", text: "Back", onclick: function () { go(state.step - 1); } }) : h("span"));
    if (state.step < STEPS.length - 1) nav.append(h("button", { class: "btn primary", type: "button", text: "Next: " + STEPS[state.step + 1].name, onclick: function () { go(state.step + 1); } }));
    s.append(nav);
    renderRail(); renderPreview();
  }
  function go(i) { state.visited[state.step] = true; state.step = i; renderStep(); try { window.scrollTo({ top: 0 }); } catch (e) {} }

  var toastEl;
  function toast(msg, kind) {
    var st = $("#status");
    if (st) { st.textContent = msg; st.className = "status " + (kind || ""); return; }
    if (!toastEl) { toastEl = h("div", { class: "toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastEl._t); toastEl._t = setTimeout(function () { toastEl.hidden = true; }, 4500);
  }
  function b64ToBytes(b64) { var bin = atob(b64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function downloads() { try { return (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } }
  function save(filename, blob) {
    return downloads().then(function (dl) {
      if (dl) return dl.save({ filename: filename, data: blob }).then(function () { toast("Saved " + filename, "ok"); }, function (e) {
        var code = e && e.code;
        if (code === "declined") toast("Download cancelled.", "");
        else if (code === "rate_limited") toast("A save prompt is already open. Finish that one first.", "bad");
        else toast("This view can't save files (" + (code || "unavailable") + "). Open the page in a browser tab and try again.", "bad");
      });
      var a = h("a", { href: URL.createObjectURL(blob), download: filename }); document.body.append(a); a.click(); a.remove(); toast("Downloaded " + filename, "ok");
    });
  }
  function generate(btn) {
    var errs = issues().filter(function (x) { return x[0] === "bad"; });
    if (errs.length) { toast("Fix first: " + errs.map(function (x) { return x[1]; }).join("; "), "bad"); return; }
    btn.disabled = true; toast("Building workbooks…", "");
    PK.generate(JSZip, b64ToBytes(HUB_B64), cleanCfg(), { sampleData: state.sample, output: "blob", onProgress: function (i, n, name) { toast("Built " + i + " of " + n + ": " + name, ""); } })
      .then(function (blob) { return save(base() + ".zip", blob); })
      .catch(function (e) { toast("Could not build the package: " + (e && e.message || e), "bad"); })
      .then(function () { btn.disabled = false; });
  }

  $("#tbLoad").addEventListener("click", function () { $("#tbFile").click(); });
  $("#tbFile").addEventListener("change", function (e) { var f = e.target.files[0]; if (f) openSetup(f); e.target.value = ""; });
  $("#tbSave").addEventListener("click", function () { save(base() + " setup.json", new Blob([JSON.stringify(state.cfg, null, 2)], { type: "application/json" })); });
  $("#tbGen").addEventListener("click", function () { generate($("#tbGen")); });
  var hashStep = STEPS.findIndex(function (st) { return "#" + st.id === location.hash; });
  if (hashStep > 0) state.step = hashStep;
  renderStep();
})();
</script>
</body></html>
